name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Content gate
        run: npm run check:content

      - name: Build
        run: npm run build
        env:
          PUBLIC_SITE_URL: https://superposition-academy.pages.dev
